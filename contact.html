    </div>
  </header>
  <main id="main">
    <section class="section subhero contact-intro">
      <div class="wrap contact-hero-layout">
        <div><h1>Start a conversation.</h1>
        <p class="lede">What would you like to learn more about? Choose a topic and send us a message.</p></div>
        <svg class="contact-quote-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true" focusable="false"><path d="M7 43V30C7 17 14 10 26 8v9c-7 2-10 6-10 11h12v25H7V43Zm29 0V30c0-13 7-20 19-22v9c-7 2-10 6-10 11h12v25H36V43Z"/></svg>
      </div>
    </section>
    <section class="section contact-section">
      <div class="wrap">
        <form class="contact-form" id="contact-form" method="post" action="/api/contact">
          <label for="contact-name">Name</label>
          <input id="contact-name" name="name" autocomplete="name" maxlength="120" required>
          <label for="contact-email">Email</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required>
          <label for="contact-topic">I’d like to learn more about</label>
          <select id="contact-topic" name="topic" required>
            <option value="" disabled selected>Select a topic</option>
            <option value="book">The Restoration of Man book</option>
            <option value="coaching">Men’s coaching</option>
            <option value="events">Speaking and events</option>
            <option value="media">Interviewing Eli</option>
            <option value="podcast">The One More Podcast</option>
            <option value="brotherhood">The One More Brotherhood</option>
            <option value="general">General inquiry</option>
          </select>
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" rows="6" maxlength="5000" required></textarea>
          <div hidden><label for="contact-website">Leave this field blank</label><input id="contact-website" name="website" tabindex="-1" autocomplete="off"></div>
          <button class="button" type="submit">Send Message</button>
          <p class="contact-status" id="contact-status" role="status" tabindex="-1"></p>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="assets/contact.js"></script>
